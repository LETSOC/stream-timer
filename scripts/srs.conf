# SRS config for stream-timer Backup 2 / Backup 3 experiment.
# Run alongside MediaMTX (different ports). Does not replace the production relay.
#
# Start (from the repo root, after git checkout exp/srs-on-main):
#   docker run --rm -it \
#     -p 19360:19360 -p 8088:8088 -p 1985:1985 -p 10080:10080/udp \
#     -v "$PWD/scripts/srs.conf:/usr/local/srs/conf/srs.conf" \
#     ossrs/srs:6
#
# OBS (Backup 2 or Backup 3):
#   Server:     rtmp://<show-mac-lan-ip>:19360/live
#   Stream Key: backup2          (or backup3)
#
# SRT (optional):
#   srt://<show-mac-lan-ip>:10080?streamid=#!::r=live/backup2,m=publish
#
# Play / test:
#   RTMP:      rtmp://127.0.0.1:19360/live/backup2
#   HTTP-FLV:  http://127.0.0.1:8088/live/backup2.flv
#   HLS:       http://127.0.0.1:8088/live/backup2.m3u8
#   API:       http://127.0.0.1:1985/api/v1/streams/

max_connections     100;
srs_log_tank        console;
daemon              off;

rtmp {
    listen          19360;
}

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8088;
    dir             ./objs/nginx/html;
}

# SRT ingest (UDP). OBS or ffmpeg can push here.
srt_server {
    enabled         on;
    listen          10080;
    maxbw           1000000000;
    connect_timeout 4000;
    # 300 ms latency (matches MediaMTX SRT_LATENCY_US = 300000)
    latency         300;
    peerlatency     300;
    recvlatency     300;
    tsbpdmode       on;
    # Drop packets that arrive too late instead of buffering forever.
    tlpktdrop       on;
    sendbuf         2000000;
    recvbuf         2000000;
    # Default streamid if the publisher doesn't send one.
    default_streamid "#!::r=live/backup2,m=publish";
}

vhost __defaultVhost__ {
    # Convert SRT ingest to RTMP so the rest of the stack can read it.
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    # Low-latency HLS for desk preview / testing (not the production player yet).
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # HTTP-FLV for quick VLC / ffplay checks.
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # Accept publish on /live/backup2 and /live/backup3 (and any other key under /live).
    # No auth here on purpose — this is a local experiment. Bind to LAN or firewall if needed.
    publish {
        mr off;
    }
    play {
        gop_cache off;
    }
}
